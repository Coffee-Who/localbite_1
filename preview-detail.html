<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocalBite - 旅遊地圖 × 行程規劃</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --blue:#007AFF; --green:#34C759; --orange:#FF9F0A; --red:#FF3B30;
  --purple:#5856D6; --food:#FF6B35; --gray:#8E8E93;
  --bg:#F2F2F7; --text:#1D1D1F; --secondary:#86868B;
}
body {
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;
  background:#1C1C1E; display:flex; flex-direction:column;
  align-items:center; min-height:100vh; padding:40px 20px;
}
.page-header { text-align:center; margin-bottom:24px; color:#F2F2F7; }
.page-header h1 { font-size:28px; font-weight:700; }
.page-header p { font-size:15px; color:#86868B; margin-top:6px; }

.phone {
  width:390px; height:844px; background:var(--bg);
  border-radius:54px;
  box-shadow:0 0 0 2px #3A3A3C,0 0 0 4px #1C1C1E,0 40px 80px rgba(0,0,0,.6);
  overflow:hidden; display:flex; flex-direction:column; position:relative;
}
.phone::before {
  content:''; position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:126px; height:34px; background:#1C1C1E;
  border-radius:0 0 20px 20px; z-index:200;
}
.status-bar {
  position:absolute; top:10px; left:28px; right:28px;
  display:flex; justify-content:space-between;
  font-size:13px; font-weight:600; color:var(--text); z-index:201;
}
.screen {
  display:none; flex:1; flex-direction:column; overflow:hidden;
  position:absolute; inset:0; bottom:74px;
}
.screen.active { display:flex; }
.bottom-nav {
  position:absolute; bottom:0; left:0; right:0;
  display:flex; background:rgba(255,255,255,.95);
  backdrop-filter:blur(20px); border-top:1px solid #E5E5EA;
  padding:8px 0 20px; z-index:100;
}
.nav-item { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; }
.nav-item svg { width:22px; height:22px; }
.nav-item span { font-size:10px; font-weight:500; color:var(--gray); }
.nav-item.active span { color:var(--blue); }

/* LOGIN */
#login-overlay {
  position:fixed; inset:0;
  background:linear-gradient(160deg,#1D1D1F,#2C2C2E);
  z-index:9999; display:flex; align-items:center; justify-content:center; padding:20px;
}
#login-overlay.hidden { display:none; }
.login-card {
  background:#FFF; border-radius:32px; padding:36px 28px;
  width:100%; max-width:360px; box-shadow:0 40px 80px rgba(0,0,0,.5);
}
.login-logo { text-align:center; margin-bottom:28px; }
.logo-icon {
  width:68px; height:68px;
  background:linear-gradient(135deg,#FF6B35,#FF9F0A);
  border-radius:20px; display:flex; align-items:center; justify-content:center;
  font-size:32px; margin:0 auto 10px;
  box-shadow:0 8px 24px rgba(255,107,53,.4);
}
.login-logo h2 { font-size:22px; font-weight:700; color:#1D1D1F; }
.login-logo p { font-size:13px; color:#86868B; margin-top:3px; }
.login-tabs {
  display:flex; background:#F2F2F7; border-radius:12px; padding:3px; margin-bottom:20px;
}
.login-tab {
  flex:1; padding:8px; border-radius:9px; border:none;
  font-size:14px; font-weight:500; cursor:pointer; background:transparent; color:#86868B; transition:all .2s;
}
.login-tab.active { background:#FFF; color:#1D1D1F; box-shadow:0 2px 8px rgba(0,0,0,.1); }
.form-group { margin-bottom:14px; }
.form-label { font-size:12px; font-weight:600; color:#3C3C43; margin-bottom:5px; display:block; text-transform:uppercase; letter-spacing:.3px; }
.form-input {
  width:100%; padding:11px 13px; border:1.5px solid #E5E5EA;
  border-radius:12px; font-size:15px; color:#1D1D1F; outline:none;
  transition:border-color .2s; background:#FAFAFA; font-family:inherit;
}
.form-input:focus { border-color:var(--blue); background:#FFF; }
.btn-primary {
  width:100%; padding:13px; background:var(--blue); color:#FFF;
  border:none; border-radius:14px; font-size:16px; font-weight:600; cursor:pointer; margin-top:6px; transition:background .2s;
}
.btn-primary:hover { background:#0071E3; }
.btn-primary:disabled { background:#C7C7CC; cursor:not-allowed; }
.login-divider {
  display:flex; align-items:center; gap:10px; margin:14px 0; color:#C7C7CC; font-size:12px;
}
.login-divider::before,.login-divider::after { content:''; flex:1; height:1px; background:#E5E5EA; }
.btn-google {
  width:100%; padding:11px; background:#FFF; border:1.5px solid #E5E5EA;
  border-radius:14px; font-size:14px; font-weight:500; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:8px; color:#1D1D1F; transition:all .2s;
}
.btn-google:hover { background:#F5F5F7; }
.btn-google:disabled { opacity:.6; cursor:not-allowed; }
.btn-guest {
  width:100%; padding:11px; background:#F2F2F7; border:none;
  border-radius:14px; font-size:14px; font-weight:500; cursor:pointer;
  color:#3C3C43; margin-top:8px; transition:background .2s;
}
.btn-guest:hover { background:#E5E5EA; }
.login-error { 
  color:var(--red); font-size:12px; margin:8px 0; text-align:center;
  min-height:36px; line-height:1.4; word-break:break-word; padding:4px;
  background:#FFEBEA; border-radius:8px; display:none;
}
.login-error.show { display:block; }
.info-banner {
  background:#E8F4FF; border-left:4px solid var(--blue);
  padding:12px 14px; border-radius:8px; margin-bottom:14px;
  font-size:12px; color:#3C3C43; line-height:1.5;
}
.toast { position:absolute; bottom:90px; left:50%; transform:translateX(-50%) translateY(20px); background:#1D1D1F; color:#FFF; padding:10px 20px; border-radius:20px; font-size:14px; font-weight:500; opacity:0; transition:all .3s; z-index:600; white-space:nowrap; pointer-events:none; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 20px; color:var(--secondary); text-align:center; }
.empty-icon { font-size:48px; margin-bottom:12px; }
.empty-state h3 { font-size:17px; font-weight:600; color:#3C3C43; }
.empty-state p { font-size:14px; margin-top:6px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-overlay">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">🍜</div>
      <h2>LocalBite</h2>
      <p>探索在地美食 × 規劃旅遊行程</p>
    </div>
    
    <div class="login-tabs">
      <button class="login-tab active" onclick="switchLoginTab('login')">登入</button>
      <button class="login-tab" onclick="switchLoginTab('register')">註冊</button>
    </div>

    <!-- LOGIN FORM -->
    <div id="login-form">
      <div class="info-banner">
        ✅ 三種登入方式可選：Google、電子郵件或訪客模式
      </div>
      <div class="form-group">
        <label class="form-label">電子郵件</label>
        <input class="form-input" type="email" id="login-email" placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label class="form-label">密碼</label>
        <input class="form-input" type="password" id="login-password" placeholder="••••••••" onkeypress="if(event.key==='Enter')handleLogin()">
      </div>
      <div class="login-error" id="login-error"></div>
      <button class="btn-primary" id="login-btn" onclick="handleLogin()">登入</button>
      
      <div class="login-divider">或</div>
      
      <button class="btn-google" id="google-btn" onclick="handleGoogleLogin()">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"/><path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.962L3.964 7.294C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
        <span id="google-text">使用 Google 登入</span>
      </button>
      
      <div class="login-divider">或</div>
      
      <button class="btn-guest" onclick="handleGuestLogin()">👤 訪客模式（不需帳號）</button>
    </div>

    <!-- REGISTER FORM -->
    <div id="register-form" style="display:none">
      <div class="form-group">
        <label class="form-label">顯示名稱</label>
        <input class="form-input" type="text" id="reg-name" placeholder="你的名字">
      </div>
      <div class="form-group">
        <label class="form-label">電子郵件</label>
        <input class="form-input" type="email" id="reg-email" placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label class="form-label">密碼</label>
        <input class="form-input" type="password" id="reg-password" placeholder="至少 6 個字元" onkeypress="if(event.key==='Enter')handleRegister()">
      </div>
      <div class="login-error" id="register-error"></div>
      <button class="btn-primary" id="register-btn" onclick="handleRegister()">建立帳號</button>
      
      <div class="login-divider">或</div>
      
      <button class="btn-guest" onclick="handleGuestLogin()">👤 訪客模式（不需帳號）</button>
    </div>
  </div>
</div>

<!-- APP -->
<div class="page-header" id="app-header" style="display:none">
  <h1>🍜 LocalBite</h1>
  <p>旅遊地圖 × 行程規劃 × 在地探索</p>
</div>

<div id="app-phone" style="display:none">
<div class="phone">
  <div class="status-bar"><span id="status-time">9:41</span><span>100%</span></div>

  <!-- SCREEN 1: MAP -->
  <div class="screen active" id="screen-map">
    <div style="padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#86868B;">
      <div style="font-size:48px;margin-bottom:16px;">🗺️</div>
      <div style="font-size:19px;font-weight:700;color:#1D1D1F;">地圖頁面</div>
      <div style="font-size:14px;margin-top:6px;">✓ 已登入成功！</div>
      <div style="font-size:12px;margin-top:12px;color:#C7C7CC;" id="login-type">登入方式：</div>
      <div style="font-size:12px;margin-top:12px;color:#C7C7CC;">點擊下方頁籤探索其他功能</div>
    </div>
  </div>

  <!-- SCREEN 2: ITINERARY -->
  <div class="screen" id="screen-itinerary">
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#86868B;">
      <div style="font-size:48px;margin-bottom:16px;">📋</div>
      <div style="font-size:19px;font-weight:700;color:#1D1D1F;">我的行程</div>
      <div style="font-size:14px;margin-top:6px;">建立你的第一個旅程吧！</div>
    </div>
  </div>

  <!-- SCREEN 3: EXPLORE -->
  <div class="screen" id="screen-explore">
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#86868B;">
      <div style="font-size:48px;margin-bottom:16px;">🔍</div>
      <div style="font-size:19px;font-weight:700;color:#1D1D1F;">探索發現</div>
      <div style="font-size:14px;margin-top:6px;">尋找靈感目的地</div>
    </div>
  </div>

  <!-- SCREEN 4: SAVED -->
  <div class="screen" id="screen-saved">
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#86868B;">
      <div style="font-size:48px;margin-bottom:16px;">🔖</div>
      <div style="font-size:19px;font-weight:700;color:#1D1D1F;">收藏景點</div>
      <div style="font-size:14px;margin-top:6px;">保存你喜愛的地點</div>
    </div>
  </div>

  <!-- SCREEN 5: PROFILE -->
  <div class="screen" id="screen-profile">
    <div style="padding:44px 16px;flex:1;overflow-y:auto;">
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;">
        <div style="width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,#007AFF,#5856D6);display:flex;align-items:center;justify-content:center;font-size:28px;color:#FFF;font-weight:700;box-shadow:0 4px 16px rgba(0,122,255,.3);" id="profile-avatar">?</div>
        <div>
          <div style="font-size:19px;font-weight:700;color:#1D1D1F;" id="profile-name">使用者</div>
          <div style="font-size:13px;color:#86868B;margin-top:4px;" id="profile-email">-</div>
          <div style="font-size:11px;font-weight:600;background:#EBF4FF;color:#007AFF;padding:3px 10px;border-radius:8px;margin-top:5px;display:inline-block;" id="profile-badge">LocalBite 會員</div>
        </div>
      </div>
      <button style="width:100%;padding:13px;background:#FFEBEA;border:none;border-radius:14px;font-size:15px;font-weight:600;color:#FF3B30;cursor:pointer;margin-top:20px;" onclick="handleLogout()">登出</button>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <div class="nav-item active" id="nav-map" onclick="switchScreen('map')">
      <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="#007AFF"/></svg>
      <span style="color:#007AFF">地圖</span>
    </div>
    <div class="nav-item" id="nav-itinerary" onclick="switchScreen('itinerary')">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z" fill="#8E8E93"/></svg>
      <span>行程</span>
    </div>
    <div class="nav-item" id="nav-explore" onclick="switchScreen('explore')">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="#8E8E93"/></svg>
      <span>探索</span>
    </div>
    <div class="nav-item" id="nav-saved" onclick="switchScreen('saved')">
      <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z" fill="#8E8E93"/></svg>
      <span>收藏</span>
    </div>
    <div class="nav-item" id="nav-profile" onclick="switchScreen('profile')">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="#8E8E93"/></svg>
      <span>我的</span>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>
</div>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBvbz07UEwVw7K3tI4JcLcW2tXkqf_bksw",
  authDomain: "localbite-8e154.firebaseapp.com",
  databaseURL: "https://localbite-8e154-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "localbite-8e154",
  storageBucket: "localbite-8e154.firebasestorage.app",
  messagingSenderId: "798128436129",
  appId: "1:798128436129:web:b8d2ec5db4d745cb4c91e0",
};

firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();

let isGuest = false;
let currentUser = null;
let loginMethod = '';

// ✅ 修正：處理 Google Redirect 回來後的登入結果
auth.getRedirectResult().then(result => {
  if (result && result.user) {
    loginMethod = '🔵 Google 登入';
    showToast('✓ Google 登入成功！');
  }
}).catch(e => {
  console.error('Redirect result error:', e);
  if (e.code && e.code !== 'auth/no-auth-event') {
    const err = document.getElementById('login-error');
    if (err) showError(err, '❌ Google 登入失敗：' + mapAuthError(e.code));
  }
});

auth.onAuthStateChanged(user => {
  if (user && !isGuest) {
    currentUser = user;
    if (!loginMethod) loginMethod = '🔵 Google / 📧 Email';
    showApp();
    updateProfileUI();
  } else if (!isGuest) {
    currentUser = null;
    showLogin();
  }
});

function showApp() {
  document.getElementById('login-overlay').classList.add('hidden');
  document.getElementById('app-header').style.display = 'block';
  document.getElementById('app-phone').style.display = 'block';
  updateClock();
  setInterval(updateClock, 30000);
}

function showLogin() {
  document.getElementById('login-overlay').classList.remove('hidden');
  document.getElementById('app-header').style.display = 'none';
  document.getElementById('app-phone').style.display = 'none';
}

function updateClock() {
  const n = new Date();
  document.getElementById('status-time').textContent =
    String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
}

function switchLoginTab(tab) {
  document.querySelectorAll('.login-tab').forEach((t,i) => t.classList.toggle('active', (i===0)===(tab==='login')));
  document.getElementById('login-form').style.display = tab==='login' ? 'block' : 'none';
  document.getElementById('register-form').style.display = tab==='register' ? 'block' : 'none';
  clearErrors();
}

async function handleLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pw = document.getElementById('login-password').value;
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');
  clearError(err);
  if (!email || !pw) { showError(err, '請填入電子郵件和密碼'); return; }
  try {
    btn.disabled = true;
    btn.textContent = '登入中...';
    await auth.signInWithEmailAndPassword(email, pw);
    loginMethod = '📧 電子郵件';
    showToast('✓ 登入成功！');
  } catch(e) {
    showError(err, mapAuthError(e.code));
  } finally {
    btn.disabled = false;
    btn.textContent = '登入';
  }
}

async function handleRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pw = document.getElementById('reg-password').value;
  const btn = document.getElementById('register-btn');
  const err = document.getElementById('register-error');
  clearError(err);
  if (!name || !email || !pw) { showError(err, '請填寫所有欄位'); return; }
  if (pw.length < 6) { showError(err, '密碼至少需要 6 個字元'); return; }
  try {
    btn.disabled = true;
    btn.textContent = '建立中...';
    const c = await auth.createUserWithEmailAndPassword(email, pw);
    await c.user.updateProfile({ displayName: name });
    loginMethod = '📧 電子郵件';
    showToast('✓ 帳號建立成功！');
  } catch(e) {
    showError(err, mapAuthError(e.code));
  } finally {
    btn.disabled = false;
    btn.textContent = '建立帳號';
  }
}

// ✅ 修正：Popup 失敗時自動改用 Redirect
async function handleGoogleLogin() {
  const btn = document.getElementById('google-btn');
  const err = document.getElementById('login-error');
  clearError(err);
  btn.disabled = true;
  document.getElementById('google-text').textContent = '連接中...';

  const provider = new firebase.auth.GoogleAuthProvider();
  provider.addScope('profile');
  provider.addScope('email');
  provider.setCustomParameters({ prompt: 'select_account' });

  try {
    await auth.signInWithPopup(provider);
    loginMethod = '🔵 Google 登入';
    showToast('✓ Google 登入成功！');
  } catch(popupErr) {
    console.warn('Popup failed, trying redirect:', popupErr.code);
    if (
      popupErr.code === 'auth/popup-blocked' ||
      popupErr.code === 'auth/cancelled-popup-request'
    ) {
      try {
        document.getElementById('google-text').textContent = '正在跳轉...';
        await auth.signInWithRedirect(provider);
        return;
      } catch(redirectErr) {
        showError(err, '❌ ' + mapAuthError(redirectErr.code));
      }
    } else if (popupErr.code === 'auth/popup-closed-by-user') {
      showError(err, '❌ 登入視窗已關閉，請再試一次。');
    } else if (popupErr.code === 'auth/unauthorized-domain') {
      try {
        document.getElementById('google-text').textContent = '正在跳轉...';
        await auth.signInWithRedirect(provider);
        return;
      } catch(redirectErr) {
        showError(err, '⚠️ 此域名尚未授權 Google 登入。請在 Firebase Console 新增授權域名，或改用電子郵件 / 訪客模式。');
      }
    } else {
      showError(err, '❌ ' + mapAuthError(popupErr.code));
    }
  } finally {
    btn.disabled = false;
    document.getElementById('google-text').textContent = '使用 Google 登入';
  }
}

function handleGuestLogin() {
  isGuest = true;
  currentUser = { uid: 'guest', displayName: '訪客', email: 'guest@localbite' };
  loginMethod = '👤 訪客模式';
  showApp();
  updateProfileUI();
  showToast('👤 已進入訪客模式');
}

async function handleLogout() {
  if (isGuest) {
    isGuest = false;
    currentUser = null;
    loginMethod = '';
    showLogin();
  } else {
    try {
      await auth.signOut();
      loginMethod = '';
      showToast('✓ 已登出');
    } catch(e) {
      showToast('❌ 登出失敗');
    }
  }
}

function mapAuthError(code) {
  const errors = {
    'auth/invalid-email': '❌ 電子郵件格式不正確',
    'auth/user-not-found': '❌ 找不到此帳號，請先註冊',
    'auth/wrong-password': '❌ 密碼錯誤',
    'auth/email-already-in-use': '❌ 此電子郵件已被使用',
    'auth/weak-password': '❌ 密碼強度不足（至少 6 字元）',
    'auth/invalid-credential': '❌ 帳號或密碼錯誤',
  };
  return errors[code] || '❌ 發生錯誤，請稍後再試';
}

function showError(el, msg) {
  el.textContent = msg;
  el.classList.add('show');
}

function clearError(el) {
  el.textContent = '';
  el.classList.remove('show');
}

function clearErrors() {
  document.getElementById('login-error').classList.remove('show');
  document.getElementById('register-error').classList.remove('show');
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

function switchScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.remove('active');
    n.querySelector('span').style.color = '';
    n.querySelectorAll('svg path').forEach(p => p.setAttribute('fill','#8E8E93'));
  });
  document.getElementById('screen-' + name).classList.add('active');
  const nav = document.getElementById('nav-' + name);
  nav.classList.add('active');
  nav.querySelector('span').style.color = '#007AFF';
  nav.querySelectorAll('svg path').forEach(p => p.setAttribute('fill','#007AFF'));
}

function updateProfileUI() {
  if (!currentUser) return;
  const name = currentUser.displayName || '使用者';
  document.getElementById('profile-name').textContent = name;
  document.getElementById('profile-email').textContent = currentUser.email || '';
  document.getElementById('profile-avatar').textContent = name.charAt(0).toUpperCase();
  document.getElementById('login-type').textContent = '登入方式：' + loginMethod;
  if (isGuest) {
    document.getElementById('profile-badge').textContent = '👤 訪客模式';
    document.getElementById('profile-badge').style.background = '#FFF3EC';
    document.getElementById('profile-badge').style.color = '#FF6B35';
  }
}
</script>
